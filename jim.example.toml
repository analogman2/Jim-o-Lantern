# Jim's settings for this machine. Copy this file to jim.toml and edit it; jim.toml is not
# committed, so your addresses stay out of the repo.
#
# Any command-line option can be set here: use its name with underscores instead of dashes
# (--min-rms 800  ->  min_rms = 800). Options given on the command line still win.

# WLED controller driving the LED curtain (required)
wled = "192.168.1.50"

# Microphone: "wled" (the controller's mic, with the firmware patch) or an ALSA capture device
# (see `arecord -L`), e.g. "plughw:CARD=Camera,DEV=0"
mic = "wled"
# min_rms = 800           # raise if Jim reacts to background noise, lower if kids must shout

# Speaker: an ALSA playback device (see `aplay -L`)
speaker = "default"

# Services on this machine
speech_url = "http://127.0.0.1:7895"      # Agentora's shared speech service
ollama_url = "http://localhost:11434"
ollama_model = "qwen3.5:9b"

# keep_loaded = true      # keep the models warm while Jim runs (all released when he stops)
# house = "Two pieces of candy each!"

# Security camera, so Jim can roast costumes (optional). The password is never stored here:
# ./set_camera.sh asks for it and saves the full address to ~/.config/jim/rtsp.
[camera]
# ip = "192.168.1.60"
# user = "admin"
# path = "h264Preview_01_main"            # Reolink main stream; other brands differ
